services:
  backend:
    build:
      context: ./backend
    ports:
      - "8000:8000"
    environment:
      ALLOWED_ORIGINS: http://localhost:5173,http://127.0.0.1:5173,https://persona-classifier.alexandre.dev
    volumes:
      - backend-data:/app/data

  frontend:
    build:
      context: ./frontend
      args:
        VITE_API_BASE_URL: https://persona-classifier.alexandre.dev/api
    ports:
      - "5173:80"
    depends_on:
      - backend

volumes:
  backend-data:
